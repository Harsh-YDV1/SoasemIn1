
# ---------- Patient Service runs on port 8081 ---------- 
server.port=8081
spring.application.name=patient-service 
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
  
# ---------- PostgreSQL database connection ---------- 
spring.datasource.url=jdbc:postgresql://localhost:5432/patient_db 
spring.datasource.username=postgres
spring.datasource.password=DBMS
  
# ---------- JPA / Hibernate settings ---------- 
# 'update' = automatically create/update tables from our @Entity classes 
spring.jpa.hibernate.ddl-auto=update 
# show every SQL query in the console (great for learning!) 
spring.jpa.show-sql=true 